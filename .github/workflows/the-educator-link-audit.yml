name: The Educator integrity audit

on:
  push:
    branches:
      - main
    paths:
      - 'the-educator/**'
      - '.github/workflows/the-educator-link-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit local links and legacy paths
        run: node the-educator/infrastructure/scripts/audit-static-links.mjs
      - name: Audit CPCS 351 navigation targets
        run: node the-educator/infrastructure/scripts/audit-cpcs351-navigation.mjs
      - name: Audit subsystem architecture
        run: node the-educator/infrastructure/scripts/audit-architecture.mjs
      - name: Smoke-test critical subsystem routes
        run: node the-educator/infrastructure/scripts/smoke-static-site.mjs
