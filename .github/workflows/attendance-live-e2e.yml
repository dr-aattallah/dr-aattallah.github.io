name: Attendance live E2E and security

on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: attendance-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDUCATOR_ADMIN_EMAIL: ${{ secrets.EDUCATOR_ADMIN_EMAIL }}
      EDUCATOR_ADMIN_PASSWORD: ${{ secrets.EDUCATOR_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Run live workflow and authorization checks
        run: ./the-educator/scripts/live-e2e-attendance.sh

      - name: Open E2E incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- attendance-live-e2e -->";
            const title = "[اختبار] فشل E2E أو تدقيق صلاحيات الحضور";
            const body = `${marker}
            فشل اختبار الإنتاج الحي أو أحد اختبارات منع الوصول غير المصرح.

            - الوقت: ${new Date().toISOString()}
            - التشغيل: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open"
            });
            const existing = data.find(issue => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body
              });
            }
