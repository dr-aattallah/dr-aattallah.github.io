name: Normalize Topic 03 assets

on:
  push:
    paths:
      - '.github/workflows/normalize-topic03-assets.yml'
      - 'the-educator/learning/courses/cpcs351/weeks/03-system-engineering/assests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy Topic 03 PNG assets to canonical folder
        run: |
          src='the-educator/learning/courses/cpcs351/weeks/03-system-engineering/assests'
          dst='the-educator/learning/courses/cpcs351/weeks/03-system-engineering/assets'
          mkdir -p "$dst"
          if compgen -G "$src/*.png" > /dev/null; then
            cp -f "$src"/*.png "$dst"/
          fi
      - name: Commit normalized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-educator/learning/courses/cpcs351/weeks/03-system-engineering/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Copy Topic 03 images into canonical assets folder'
            git push
          fi