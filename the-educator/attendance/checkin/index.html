<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <title>تسجيل الحضور — The Educator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/attendance.css">
</head>
<body class="subpage">
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="grain"></div>
  <header class="nav-shell liquid-glass compact">
    <a class="brand" href="../"><span class="brand-orb">E</span><span>The Educator</span></a>
    <a class="back-link" href="../">رجوع</a>
  </header>

  <main class="checkin-wrap">
    <section class="checkin-card liquid-glass reveal">
      <span class="eyebrow">تسجيل حضور آمن</span>
      <h1>أهلًا بك</h1>
      <p>أدخل رقمك الجامعي لتسجيل حضورك.</p>

      <div class="session-summary">
        <div><span>المقرر</span><strong>CPCS-203</strong></div>
        <div><span>الجلسة</span><strong>09:00 - 10:20</strong></div>
        <div><span>البطاقة</span><strong id="tagDisplay">غير محددة</strong></div>
      </div>

      <form id="checkinForm" novalidate>
        <label for="studentId">الرقم الجامعي</label>
        <input id="studentId" name="studentId" type="text" inputmode="numeric" placeholder="أدخل الرقم الجامعي" minlength="5" maxlength="20" required>
        <button id="submitButton" class="primary-button full" type="submit">
          <span class="button-text">تسجيل الحضور</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="messageBox" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="../js/checkin.js"></script>
</body>
</html>
