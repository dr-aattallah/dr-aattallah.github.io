<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Why Software Engineering?</title><desc id="d">Visual showing conceptualization, communication and coordination challenges, the blind men and elephant metaphor, and software engineering responses using processes, UML and tools.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><linearGradient id="teal" x1="0" x2="1"><stop stop-color="#13a8a8"/><stop offset="1" stop-color="#2f80ed"/></linearGradient><linearGradient id="violet" x1="0" x2="1"><stop stop-color="#6d5bd0"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".12"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#13213a">Why Software Engineering?</text><text x="800" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#394b68">Software teams must overcome three major challenges</text><g font-family="Arial,sans-serif"><g transform="translate(80,180)"><rect width="440" height="220" rx="28" fill="#fff" filter="url(#sh)"/><circle cx="58" cy="58" r="34" fill="#12a3a6"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">1</text><rect x="130" y="30" width="260" height="100" rx="14" fill="#eef7ff" stroke="#b9d4ee"/><path d="M165 65h55m20 0h45m20 0h45M190 65v40m75-40v40m75-40v40M165 105h175" stroke="#496c9d" stroke-width="6" fill="none" stroke-linecap="round"/><text x="130" y="160" font-size="30" font-weight="700" fill="#0b7f86">Conceptualization</text><text x="130" y="195" font-size="20" fill="#334155">Turning abstract ideas into a shared model.</text></g><g transform="translate(580,180)"><rect width="440" height="220" rx="28" fill="#fff" filter="url(#sh)"/><circle cx="58" cy="58" r="34" fill="#2f80ed"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">2</text><circle cx="190" cy="75" r="28" fill="#dbeafe"/><circle cx="310" cy="75" r="28" fill="#dbeafe"/><path d="M180 120c15-32 65-32 80 0M300 120c15-32 65-32 80 0" stroke="#456aa6" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M225 48h55M255 78h55" stroke="#2f80ed" stroke-width="10" stroke-linecap="round"/><text x="130" y="160" font-size="30" font-weight="700" fill="#2365cf">Communication</text><text x="130" y="195" font-size="20" fill="#334155">Sharing information clearly and consistently.</text></g><g transform="translate(1080,180)"><rect width="440" height="220" rx="28" fill="#fff" filter="url(#sh)"/><circle cx="58" cy="58" r="34" fill="#7556c8"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">3</text><path d="M150 115h230M170 75h170" stroke="#7556c8" stroke-width="12" stroke-linecap="round"/><circle cx="180" cy="115" r="18" fill="#d9ccff"/><circle cx="265" cy="115" r="18" fill="#d9ccff"/><circle cx="350" cy="115" r="18" fill="#d9ccff"/><path d="M370 42v100M355 58h30" stroke="#8898b8" stroke-width="6"/><text x="130" y="160" font-size="30" font-weight="700" fill="#6747bd">Coordination</text><text x="130" y="195" font-size="20" fill="#334155">Aligning dependencies, effort and timing.</text></g></g><g transform="translate(95,455)" font-family="Arial,sans-serif"><ellipse cx="360" cy="250" rx="250" ry="150" fill="#aeb7c4"/><circle cx="560" cy="205" r="95" fill="#aeb7c4"/><path d="M620 230c80 70 55 165-5 205" stroke="#aeb7c4" stroke-width="58" fill="none" stroke-linecap="round"/><path d="M515 185l-62 84" stroke="#f5f7fa" stroke-width="22"/><circle cx="585" cy="180" r="8" fill="#1f2937"/><rect x="210" y="320" width="52" height="150" rx="25" fill="#929cab"/><rect x="400" y="320" width="52" height="150" rx="25" fill="#929cab"/><g fill="#fff" stroke="#c9d3df" stroke-width="3"><rect x="70" y="175" width="155" height="65" rx="18"/><rect x="275" y="405" width="155" height="65" rx="18"/><rect x="535" y="95" width="155" height="65" rx="18"/><rect x="650" y="260" width="155" height="65" rx="18"/></g><g fill="#23314d" font-size="23" font-weight="700"><text x="147" y="214" text-anchor="middle">It's a Spear!</text><text x="352" y="444" text-anchor="middle">It's a Snake!</text><text x="612" y="134" text-anchor="middle">It's a Wall!</text><text x="728" y="299" text-anchor="middle">It's a Rope!</text></g><text x="360" y="505" text-anchor="middle" font-size="22" fill="#44546d">Different partial views → different mental models</text></g><g transform="translate(880,470)" font-family="Arial,sans-serif"><rect width="620" height="400" rx="32" fill="#fff" stroke="#d6ddeb" stroke-width="3" filter="url(#sh)"/><rect x="24" y="-22" width="200" height="58" rx="24" fill="url(#violet)"/><text x="124" y="16" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Solution</text><g transform="translate(48,70)"><circle cx="38" cy="38" r="34" fill="#d9f7f4"/><path d="M38 14v48M14 38h48" stroke="#0f9e9e" stroke-width="8"/><text x="95" y="30" font-size="26" font-weight="700" fill="#18233a">Processes & methodologies</text><text x="95" y="62" font-size="19" fill="#475569">Structure analysis and design work.</text></g><g transform="translate(48,170)"><circle cx="38" cy="38" r="34" fill="#dbeafe"/><path d="M18 30h40M18 45h30" stroke="#2f80ed" stroke-width="8" stroke-linecap="round"/><text x="95" y="30" font-size="26" font-weight="700" fill="#18233a">UML for communication</text><text x="95" y="62" font-size="19" fill="#475569">A shared visual language for alignment.</text></g><g transform="translate(48,270)"><circle cx="38" cy="38" r="34" fill="#eee7ff"/><path d="M20 20l36 36M56 20L20 56" stroke="#7255c9" stroke-width="8" stroke-linecap="round"/><text x="95" y="30" font-size="26" font-weight="700" fill="#18233a">Supporting tools</text><text x="95" y="62" font-size="19" fill="#475569">Automate or support methodology steps.</text></g></g><g transform="translate(360,905)" font-family="Arial,sans-serif"><rect width="880" height="62" rx="28" fill="#fff" stroke="#d9e2ee"/><circle cx="42" cy="31" r="22" fill="#d9f7f4"/><path d="M30 31h24M42 19v24" stroke="#0e948f" stroke-width="5"/><text x="84" y="39" font-size="25" font-weight="700" fill="#167f80">Integrated Approach</text><text x="330" y="39" font-size="21" fill="#334155">Processes + shared models + tools → one coordinated team view</text></g></svg>