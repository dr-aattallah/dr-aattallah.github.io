wrap}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #cfd9e8;background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;min-height:43px;font-size:14px;font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.42;cursor:default}.reset{background:transparent;border-color:transparent;color:#64728a}.legend{font-size:12px;color:var(--muted)}.feedback{padding:15px 23px;border-top:1px solid var(--line);background:#f5f7fc;display:flex;align-items:start;gap:10px;min-height:82px}.signal{width:8px;height:8px;border-radius:50%;background:#7790b3;margin-top:9px;flex:none}.feedback.mismatch{background:#fff2f2}.mismatch .signal{background:var(--red)}.feedback.shared{background:#edf8f3}.shared .signal{background:var(--green)}.feedback strong{display:block;font-size:14px}.feedback p{font-size:14px;margin:0;color:#55657b}.references{padding:13px 23px;border-top:1px solid var(--line)}summary{cursor:pointer;font-size:13px;font-weight:650;color:#576883}.ref-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:12px}.ref-node{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:9px}.ref-node b{display:block;color:var(--ink);font-size:13px}.ref-node code{display:block;margin-top:4px}.lesson{margin-top:33px;display:grid;grid-template-columns:1fr 1.12fr;gap:40px}.steps{list-style:none;margin:0;padding:0;counter-reset:s}.steps li{counter-increment:s;display:grid;grid-template-columns:27px 1fr;gap:10px;padding:9px 0;font-size:14px;color:#55657b}.steps li:before{content:counter(s);display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e6edfc;color:#2450a7;font-size:12px;font-weight:750}.steps b{color:var(--ink)}code{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#eaf0fa;padding:1px 4px;border-radius:4px}pre{margin:0;background:#142139;color:#eef5ff;padding:21px;border-radius:12px;overflow:auto;font-size:13p s{margin-top:12px;display:inline-flex}.lab-grid{grid-template-columns:1fr}.systems{grid-template-columns:1fr;padding:0 16px;gap:0}.system{padding:11px 0;border-bottom:1px solid var(--line)}.system-head{display:flex}.system-value{font-size:21px}.system-detail{font-size:12px}.badge{margin:0}.controls{padding:15px}.feedback,.references{padding:14px 16px}.feedback{min-height:100px}.lesson,.check{grid-template-columns:1fr;gap:23px}.ref-flow{grid-template-columns:1fr}.game-name{font-size:12px}.local{font-size:11px}.stage-top{padding:15px 16px 0}.stage-message{font-size:12px}.btn{font-size:13px;padding:8px 11px}.lede{font-size:16px}h2{font-size:22px}.legend{width:100%}pre{padding:17px;font-size:12px}.check{gap:10px}footer{font-size:11px}}@media(prefers-reduced-motion:reduce){.animated-car{will-change:auto}}@media print{.controls,.modes,.answers{display:none}.lab,.lesson{break-inside:avoid}body{background:white}.stage{print-color-adjust:exact}}\n.lesson>div,.check>div,.intro>div{min-width:0}.steps li>div{min-width:0}.code-header{flex-wrap:wrap}pre{max-width:100%}body{background:transparent}main{max-width:none;padding:0;margin:0}.lab{box-shadow:none}.check{margin:18px 0 4px}.boundary{margin-top:18px;padding:12px 0}.lab-title{font-size:15px}.legend{font-size:12px}.feedback{min-height:80px}<\/style>\n<\/head>\n<body>\n\n<main>\n\n\n<section class=\"lab\" aria-label=\"Interactive racing example\" id=\"race-lab\">\n<div class=\"lab-top\"><div><div class=\"lab-title\">Run the same race in two designs<\/div><div class=\"lab-sub\">Start the race, then complete its three laps.<\/div><\/div><div class=\"modes\" role=\"group\" aria-label=\"Session creation design\"><button class=\"mode\" id=\"copies\" type=\"button\" aria-pressed=\"true\">Separate instances<\/button><button class=\"mode\" id=\"singleton\" type=\"button\" aria-pressed=\"false\">Singleton<\/button><\/div><\/div>\n<div class=\"lab-grid\"><div class=\"stage\"><div class=\"stage-top\"><span class=\"game-name\">RIYADH SPRINT<\/span><span class=\"local\">Fictional game · single player<\/span><\/div>\n<svg class=\"track\" viewBox=\"0 0 680 310\" role=\"img\" aria-labelledby=\"track-title track-desc\"><title id=\"track-title\">Riyadh Sprint circuit<\/title><desc id=\"track-desc\">An illustrated racetrack around a stylized Riyadh skyline. The car completes one animated lap when Complete lap is pressed. The actual race control state appears below the track.<\/desc><defs><pattern id=\"dots\" width=\"25\" height=\"25\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".8\" fill=\"#2a3a50\"/><\/pattern><linearGradient id=\"car-paint\" x1=\"0\" x2=\"1\"><stop stop-color=\"#6ce5c6\"/><stop offset=\"1\" stop-color=\"#25b9a6\"/><\/linearGradient><\/defs><rect width=\"680\" height=\"310\" fill=\"url(#dots)\"/>\n<g fill=\"#26374e\" stroke=\"#3d526c\" stroke-width=\"1\"><path d=\"M273 156V111H287V102H304V155Z\"/><path d=\"M311 156V71L329 59 347 71V156Z\"/><path d=\"M317 72V89Q329 102 341 89V72Z\" fill=\"#101d31\"/><path d=\"M356 156V105H380V156Z\"/><path d=\"M389 156V85L403 53 417 85V156Z\"/><path d=\"M431 156V119H452V156Z\"/><\/g><path d=\"M265 158H460\" stroke=\"#4b5e74\"/><text x=\"360\" y=\"184\" text-anchor=\"middle\" fill=\"#7a91ad\" font-size=\"11\" letter-spacing=\"4\">RIYADH<\/text>\n<defs><path id=\"race-path\" d=\"M180 65 L482 65 C554 65 601 100 601 157 C601 214 554 250 482 250 L180 250 C109 250 70 214 70 157 C70 100 109 65 180 65 Z\"/><\/defs><use href=\"#race-path\" fill=\"none\" stroke=\"#507e8a\" stroke-width=\"53\"/><use href=\"#race-path\" fill=\"none\" stroke=\"#c8d6db\" stroke-width=\"45\" stroke-dasharray=\"9 9\"/><use href=\"#race-path\" fill=\"none\" stroke=\"#31465d\" stroke-width=\"38\"/><use href=\"#race-path\" fill=\"none\" stroke=\"#a1b3c8\" stroke-width=\"1.5\" stroke-dasharray=\"7 10\"/>\n<g transform=\"translate(176 42)\"><rect width=\"13\" height=\"46\" fill=\"#d8e4f3\"/><path d=\"M0 0H6.5V6.5H0ZM6.5 6.5H13V13H6.5ZM0 13H6.5V19.5H0ZM6.5 19.5H13V26H6.5ZM0 26H6.5V32.5H0ZM6.5 32.5H13V39H6.5ZM0 39H6.5V46H0Z\" fill=\"#172a40\"/><\/g><text x=\"180\" y=\"29\" text-anchor=\"middle\" fill=\"#a7bad2\" font-size=\"10\" letter-spacing=\"2\">START / FINISH<\/text>\n<g id=\"car\" class=\"animated-car\" transform=\"translate(180 65)\"><rect x=\"-17\" y=\"-13\" width=\"10\" height=\"5\" rx=\"1\" fill=\"#0b1321\"/><rect x=\"7\" y=\"-13\" width=\"10\" height=\"5\" rx=\"1\" fill=\"#0b1321\"/><rect x=\"-17\" y=\"8\" width=\"10\" height=\"5\" rx=\"1\" fill=\"#0b1321\"/><rect x=\"7\" y=\"8\" width=\"10\" height=\"5\" rx=\"1\" fill=\"#0b1321\"/><rect x=\"-20\" y=\"-10\" width=\"40\" height=\"20\" rx=\"6\" fill=\"url(#car-paint)\"/><rect x=\"-5\" y=\"-7\" width=\"11\" height=\"14\" rx=\"3\" fill=\"#183b52\"/><path d=\"M13 -6V6\" stroke=\"#d7fff2\" stroke-width=\"3\"/><rect x=\"-20\" y=\"-13\" width=\"3\" height=\"26\" rx=\"1\" fill=\"#85e8cf\"/><\/g>\n<\/svg><div class=\"lights\" id=\"lights\" aria-hidden=\"true\"><span class=\"light\"><\/span><span class=\"light\"><\/span><span class=\"light\"><\/span><\/div><div class=\"stage-message\" id=\"stage-message\">Race control is waiting to start.<\/div><\/div>\n<div class=\"systems\"><div class=\"system\"><div class=\"system-head\"><span class=\"system-label\">RACE CONTROL<\/span><span class=\"badge\" id=\"control-state\">WAITING<\/span><\/div><div class=\"system-value\" id=\"control-value\">0 / 3 laps<\/div><div class=\"system-detail\">Starts the race and records laps<\/div><\/div><div class=\"system\"><div class=\"system-head\"><span class=\"system-label\">LAP DISPLAY<\/span><span class=\"badge\" id=\"hud-state\">WAITING<\/span><\/div><div class=\"system-value\" id=\"hud-value\">0 / 3 laps<\/div><div class=\"system-detail\">Reads the session for the dashboard<\/div><\/div><div class=\"system\"><div class=\"system-head\"><span class=\"system-label\">RESULTS PANEL<\/span><span class=\"badge\" id=\"results-state\">WAITING<\/span><\/div><div class=\"system-value\" id=\"results-value\">No result yet<\/div><div class=\"system-detail\" id=\"results-detail\">Reads the final recorded race time<\/div><\/div><\/div><\/div>\n<div class=\"controls\"><div class=\"buttons\"><button class=\"btn primary\" id=\"start\" type=\"button\">Start race<\/button><button class=\"btn\" id=\"lap\" type=\"button\" disabled>Complete lap<\/button><button class=\"btn reset\" id=\"restart\" type=\"button\">Restart demo<\/button><\/div><span class=\"legend\">Simulated lap times · 42.7 s / 41.9 s / 42.3 s<\/span><\/div>\n<div class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\"><span class=\"signal\" aria-hidden=\"true\"><\/span><div><strong id=\"feedback-title\">Three objects can begin with identical values.<\/strong><p id=\"feedback-text\">Press Start race. Check whether the dashboard starts with race control.<\/p><\/div><\/div>\n<details class=\"references\"><summary>Show which object each system uses<\/summary><div class=\"ref-flow\"><div class=\"ref-node\">Race control<b id=\"control-id\">RaceSession #1<\/b><code id=\"control-call\">new RaceSession()<\/code><\/div><div class=\"ref-node\">Lap display<b id=\"hud-id\">RaceSession #2<\/b><code id=\"hud-call\">new RaceSession()<\/code><\/div><div class=\"ref-node\">Results panel<b id=\"results-id\">RaceSession #3<\/b><code id=\"results-call\">new RaceSession()<\/code><\/div><\/div><\/details>\n<\/section>\n\n\n\n<div class=\"boundary\"><strong>What to notice<\/strong> Each system reads the same stored session through <code>getInstance()<\/code>. The private constructor controls creation. The scope here is one local race; multiple independent races need separate session state.<\/div>\n<section class=\"check\" aria-label=\"Check your understanding\"><div><div class=\"kicker\">One quick check<\/div><p><strong>Three systems call getInstance() once each. How many RaceSession objects do they get?<\/strong><\/p><\/div><div><div class=\"answers\"><button class=\"btn answer\" id=\"answer-one\" type=\"button\" aria-pressed=\"false\">One object<\/button><button class=\"btn answer\" id=\"answer-three\" type=\"button\" aria-pressed=\"false\">Three objects<\/button><\/div><div class=\"answer-text\" id=\"answer-text\" aria-live=\"polite\"><\/div><\/div><\/section>\n\n<\/main>\n<script>\n(() => {\n  const lapTimes = [42.7, 41.9, 42.3];\n  const $ = id => document.getElementById(id);\n  let mode = 'copies';\n  let sessions;\n  let frame = 0;\n  let animating = false;\n  let epoch = 0;\n  class Session {\n    constructor(id) { this.id = id; this.state = 'WAITING'; this.laps = 0; this.tenths = 0; }\n    start() { if (this.state === 'WAITING') this.state = 'RUNNING'; }\n    recordLap() {\n      if (this.state !== 'RUNNING') return;\n      this.tenths += Math.round(lapTimes[this.laps] * 10);\n      this.laps++;\n      if (this.laps === lapTimes.length) this.state = 'FINISHED';\n    }\n  }\n  function newGameRun() {\n    let nextId = 1;\n    const create = () => new Session(nextId++);\n    const instance = mode === 'singleton' ? create() : null;\n    const obtain = () => instance || create();\n    return {control:obtain(), hud:obtain(), results:obtain()};\n  }\n  const formatTime = tenths => {\n    const minutes = Math.floor(tenths / 600);\n    const seconds = ((tenths % 600) / 10).toFixed(1).padStart(4, '0');\n    return minutes + ':' + seconds;\n  };\n  function positionCar(progress) {\n    const path = $('race-path');\n    const length = path.getTotalLength();\n    const p = path.getPointAtLength(progress * length);\n    const ahead = path.getPointAtLength(((progress + .002) % 1) * length);\n    const angle = Math.atan2(ahead.y - p.y, ahead.x - p.x) * 180 / Math.PI;\n    $('car').setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + angle + ')');\n  }\n  function render() {\n    for (const system of ['control','hud','results']) {\n      const session = sessions[system];\n      $(system + '-state').textContent = session.state;\n      $(system + '-state').className = 'badge ' + session.state.toLowerCase();\n      $(system + '-id').textContent = 'RaceSession #' + session.id;\n      $(system + '-call').textContent = mode === 'singleton' ? 'getInstance()' : 'new RaceSession()';\n    }\n    $('control-value').textContent = sessions.control.laps + ' / 3 laps';\n    $('hud-value').textContent = sessions.hud.laps + ' / 3 laps';\n    const results = sessions.results;\n    $('results-value').textContent = results.state === 'FINISHED' ? formatTime(results.tenths) : results.state === 'RUNNING' ? 'Race in progress' : 'No result yet';\n    $('results-detail').textContent = results.state === 'FINISHED' ? 'Total of the three simulated lap times' : 'Reads the final recorded race time';\n    const control = sessions.control;\n    $('start').disabled = control.state !== 'WAITING';\n    $('lap').disabled = control.state !== 'RUNNING' || animating;\n    $('lap').textContent = animating ? 'Completing lap…' : 'Complete lap';\n    $('lights').className = 'lights ' + control.state.toLowerCase();\n    $('stage-message').textContent = control.state === 'WAITING' ? 'Race control is waiting to start.' : control.state === 'FINISHED' ? 'Race control finished · ' + formatTime(control.tenths) : 'Race control is running · ' + control.laps + ' of 3 laps recorded';\n    const mismatch = sessions.hud.state !== control.state || sessions.hud.laps !== control.laps || sessions.results.state !== control.state;\n    $('feedback').className = 'feedback ' + (mismatch ? 'mismatch' : mode === 'singleton' ? 'shared' : '');\n    if (mismatch) {\n      $('feedback-title').textContent = control.state === 'FINISHED' ? 'The car finished. The results panel still has no result.' : 'Race control is running. The dashboard still says WAITING.';\n      $('feedback-text').textContent = 'The systems read different objects. Switch to Singleton and repeat the race.';\n    } else if (mode === 'singleton') {\n      $('feedback-title').textContent = control.state === 'FINISHED' ? 'All three systems agree on the finished race.' : control.state === 'RUNNING' ? 'The same race state is visible to every system.' : 'All three systems reference RaceSession #1.';\n      $('feedback-text').textContent = control.state === 'FINISHED' ? 'Three laps total 126.9 seconds, displayed as 2:06.9.' : 'Every getInstance() call returns the stored session. Start the race and complete its laps.';\n    } else {\n      $('feedback-title').textContent = 'Three objects can begin with identical values.';\n      $('feedback-text').textContent = 'Press Start race. Check whether the dashboard starts with race control.';\n    }\n  }\n  function restart() {\n    epoch++;\n    cancelAnimationFrame(frame);\n    animating = false;\n    sessions = newGameRun();\n    positionCar(0);\n    render();\n  }\n  function completeLap() {\n    if (animating || sessions.control.state !== 'RUNNING') return;\n    const currentEpoch = epoch;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      sessions.control.recordLap(); positionCar(0); render(); return;\n    }\n    animating = true;\n    render();\n    const started = performance.now();\n    function advance(now) {\n      if (currentEpoch !== epoch) return;\n      const progress = Math.min((now - started) / 1050, 1);\n      positionCar(progress === 1 ? 0 : progress);\n      if (progress < 1) frame = requestAnimationFrame(advance);\n      else { animating = false; sessions.control.recordLap(); render(); }\n    }\n    frame = requestAnimationFrame(advance);\n  }\n  ['copies','singleton'].forEach(design => $(design).addEventListener('click', () => {\n    if (mode === design) return;\n    mode = design;\n    ['copies','singleton'].forEach(id => $(id).setAttribute('aria-pressed', String(id === mode)));\n    restart();\n  }));\n  $('start').addEventListener('click', () => { sessions.control.start(); render(); });\n  $('lap').addEventListener('click', completeLap);\n  $('restart').addEventListener('click', restart);\n  ['one','three'].forEach(answer => $('answer-' + answer).addEventListener('click', () => {\n    ['one','three'].forEach(id => $('answer-' + id).setAttribute('aria-pressed', String(id === answer)));\n    $('answer-text').textContent = answer === 'one' ? 'Correct. Three references point to the same stored object.' : 'Each call returns the same object. Three calls do not create three sessions.';\n  }));\n  restart();\n})();\n<\/script>\n<script>\n(() => {\n  const content = document.querySelector('main');\n  let previous = 0;\n  const report = () => {\n    const height = Math.ceil(content.getBoundingClientRect().height) + 12;\n    if (height !== previous) {\n      previous = height;\n      parent.postMessage({ type: 'singleton-race-height', height }, '*');\n    }\n  };\n  new ResizeObserver(report).observe(content);\n  report();\n})();\n<\/script><\/body>\n<\/html>\n";
    section.append(frame);
    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.data?.type !== 'singleton-race-height') return;
      const height = event.data.height;
      if (typeof height === 'number' && Number.isFinite(height) && height >= 200 && height <= 6000) {
        frame.style.setProperty('height', Math.ceil(height) + 'px', 'important');
      }
    });
    navigation.before(section);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount, { once: true });
  } else {
    mount();
  }
})();
</script>
