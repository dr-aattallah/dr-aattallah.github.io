<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic 13 Practice | CPCS 351</title><link rel="stylesheet" href="../../study.css"><link rel="stylesheet" href="topic13.css"><style>.quiz{display:grid;gap:16px}.q{padding:22px;border:1px solid #ddd8f5;border-radius:19px;background:#fff}.q h3{margin-top:0}.options{display:grid;gap:8px}.options button{padding:12px;text-align:left;border:1px solid #dce3ee;border-radius:11px;background:#f9fbff;cursor:pointer;font-weight:750}.options button:hover{border-color:#6845d4}.feedback{display:none;margin-top:10px;padding:11px;border-radius:10px;background:#effaf4}.feedback.show{display:block}.score{position:sticky;top:12px;z-index:3;padding:13px 16px;border-radius:14px;background:#171c36;color:#fff;font-weight:900}</style></head><body data-topic="13" data-page="1"><header class="topbar"></header><div class="shell"><aside class="sidebar"><div class="side-head"><small>Topic 13</small><strong>Security & Privacy</strong></div><a class="side-link" href="index.html"><span>01</span>Back to Topic</a></aside><main><article class="content"><section class="hero"><div class="hero-copy"><div class="eyebrow">Interactive Practice</div><h1>Security & Privacy Mission</h1><p class="lead">Eight scenario questions across the complete Topic 13 lecture.</p></div></section><div class="score">Score: <span id="score">0</span> / 8</div><section class="quiz" id="quiz"></section><nav class="lesson-nav"><a href="index.html">← Topic 13 Home</a></nav></article></main></div><script>
const qs=[
["An online shop collects only the information necessary to complete checkout. Which privacy practice is this?",["Anonymization","Data Minimization","Authorization"],1,"Data Minimization limits collection and retention to what is necessary for a specific purpose."],
["Unauthorized disclosure of a patient record directly violates which CIA property?",["Availability","Integrity","Confidentiality"],2,"Confidentiality protects sensitive information from unauthorized access or disclosure."],
["A weak input-validation routine that can be exploited is best described as a…",["Vulnerability","Attack","Authorization"],0,"A vulnerability is the weakness or 'hole' used in an attack."],
["A user enters a password to prove the claimed identity. This is…",["Identification","Authentication","Authorization"],1,"Authentication confirms that you truly are who you identify as."],
["Which password is explicitly the kind of simple pattern the lecture says to avoid?",["11111111","A mixed-character password","A password with 3 character categories"],0,"The lecture explicitly lists simple patterns such as 12345678 and 11111111 as weak choices."],
["A program assumes checked data cannot change before it is used. Which lecture weakness is relevant?",["Race condition (TOC/TOU)","Anonymization","Open Design"],0,"The lecture lists race conditions, Time of Check / Time of Use, among software-security weaknesses."],
["Which secure-design principle says to check every access to every object?",["Economy of Mechanism","Complete Mediation","Data Minimization"],1,"Complete Mediation: check every access to every object."],
["Which set contains only malware types named in the lecture?",["Virus, Worm, Trojan, Spyware","Phishing, Firewall, Worm, PIN","Trojan, Authorization, Virus, Consent"],0,"The source slides list Virus, Worm, Trojan and Spyware."]
];
let score=0,answered=new Set();const root=document.getElementById('quiz');
qs.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3><div class="options">'+q[1].map((o,j)=>'<button data-j="'+j+'">'+o+'</button>').join('')+'</div><div class="feedback"></div>';root.append(d);d.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(answered.has(i))return;answered.add(i);const ok=+b.dataset.j===q[2];if(ok)score++;document.getElementById('score').textContent=score;const f=d.querySelector('.feedback');f.classList.add('show');f.innerHTML='<b>'+(ok?'✓ Correct':'✗ Not quite')+'</b><br>'+q[3];d.querySelectorAll('button').forEach(x=>x.disabled=true)})});
</script><script src="../../course-header.js"></script></body></html>
