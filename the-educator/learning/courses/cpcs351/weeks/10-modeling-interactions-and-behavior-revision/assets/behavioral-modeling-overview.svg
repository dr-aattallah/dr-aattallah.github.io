<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Integrated Behavioral Modeling overview</title><desc id="d">A colorful visual showing one smart parcel locker scenario viewed through Sequence, State, and Activity UML diagrams.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#effcf7"/></linearGradient><linearGradient id="seq" x1="0" x2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="state" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient><linearGradient id="act" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#10b981"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity=".14"/></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="70" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">One scenario. Three behavioral views.</text><text x="70" y="125" font-family="Arial, sans-serif" font-size="20" fill="#526078">Choose the UML view from the question you need to answer.</text><g filter="url(#sh)"><rect x="70" y="175" width="1260" height="160" rx="28" fill="#fff"/><circle cx="155" cy="255" r="48" fill="#eef2ff"/><text x="155" y="268" text-anchor="middle" font-family="Arial" font-size="45">📦</text><text x="230" y="225" font-family="Arial" font-size="25" font-weight="700" fill="#172033">Smart Parcel Locker Pickup</text><text x="230" y="265" font-family="Arial" font-size="20" fill="#526078">Parcel arrives → pickup code sent → customer validates → locker opens → pickup confirmed</text><rect x="1030" y="210" width="230" height="90" rx="20" fill="#f8fafc" stroke="#dbe4f0"/><text x="1145" y="245" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Anchor question</text><text x="1145" y="273" text-anchor="middle" font-family="Arial" font-size="15" fill="#526078">What do you want to know?</text></g><path d="M700 335v55" stroke="#94a3b8" stroke-width="5"/><path d="M700 390l-12-18h24z" fill="#94a3b8"/><g filter="url(#sh)"><rect x="70" y="420" width="390" height="260" rx="26" fill="#fff"/><rect x="70" y="420" width="390" height="16" rx="8" fill="url(#seq)"/><circle cx="125" cy="485" r="28" fill="#eef2ff"/><text x="125" y="495" text-anchor="middle" font-family="Arial" font-size="26">💬</text><text x="170" y="480" font-family="Arial" font-size="24" font-weight="700" fill="#4f46e5">Sequence</text><text x="105" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#172033">Who interacts, and in what order?</text><line x1="130" y1="575" x2="130" y2="635" stroke="#7c3aed" stroke-width="3"/><line x1="235" y1="575" x2="235" y2="635" stroke="#7c3aed" stroke-width="3"/><line x1="340" y1="575" x2="340" y2="635" stroke="#7c3aed" stroke-width="3"/><path d="M140 592h83" stroke="#7c3aed" stroke-width="3"/><path d="M223 592l-11-7v14z" fill="#7c3aed"/><path d="M245 615h83" stroke="#7c3aed" stroke-width="3"/><path d="M328 615l-11-7v14z" fill="#7c3aed"/></g><g filter="url(#sh)"><rect x="505" y="420" width="390" height="260" rx="26" fill="#fff"/><rect x="505" y="420" width="390" height="16" rx="8" fill="url(#state)"/><circle cx="560" cy="485" r="28" fill="#fff7ed"/><text x="560" y="495" text-anchor="middle" font-family="Arial" font-size="26">🔄</text><text x="605" y="480" font-family="Arial" font-size="24" font-weight="700" fill="#ea580c">State</text><text x="540" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#172033">How does one subject change?</text><rect x="545" y="580" width="90" height="48" rx="18" fill="#fff7ed" stroke="#fb923c"/><rect x="682" y="580" width="90" height="48" rx="18" fill="#fff7ed" stroke="#fb923c"/><path d="M635 604h47" stroke="#f97316" stroke-width="3"/><path d="M682 604l-10-7v14z" fill="#f97316"/><text x="590" y="610" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c2d12">Ready</text><text x="727" y="610" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c2d12">Collected</text></g><g filter="url(#sh)"><rect x="940" y="420" width="390" height="260" rx="26" fill="#fff"/><rect x="940" y="420" width="390" height="16" rx="8" fill="url(#act)"/><circle cx="995" cy="485" r="28" fill="#ecfeff"/><text x="995" y="495" text-anchor="middle" font-family="Arial" font-size="26">🧭</text><text x="1040" y="480" font-family="Arial" font-size="24" font-weight="700" fill="#0f766e">Activity</text><text x="975" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#172033">How does work flow and branch?</text><rect x="985" y="575" width="100" height="42" rx="16" fill="#ecfeff" stroke="#14b8a6"/><polygon points="1140,575 1165,596 1140,617 1115,596" fill="#f0fdfa" stroke="#14b8a6"/><rect x="1200" y="575" width="95" height="42" rx="16" fill="#ecfeff" stroke="#14b8a6"/><path d="M1085 596h30M1165 596h35" stroke="#0f766e" stroke-width="3"/><text x="1035" y="601" text-anchor="middle" font-family="Arial" font-size="13" fill="#134e4a">Validate</text><text x="1248" y="601" text-anchor="middle" font-family="Arial" font-size="13" fill="#134e4a">Open</text></g></svg>