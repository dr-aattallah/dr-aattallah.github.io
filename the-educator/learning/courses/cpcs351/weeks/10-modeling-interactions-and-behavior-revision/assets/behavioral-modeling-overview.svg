<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d"><title id="t">Integrated UML Modeling overview</title><desc id="d">One Smart Parcel Locker Pickup scenario viewed through Use Case, Sequence, State, and Activity UML diagrams.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#effcf7"/></linearGradient><linearGradient id="uc" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="seq" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="state" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient><linearGradient id="act" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#10b981"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity=".14"/></filter></defs><rect width="1500" height="820" rx="34" fill="url(#bg)"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">One scenario. Four UML views.</text><text x="70" y="122" font-family="Arial, sans-serif" font-size="20" fill="#526078">Start from one requirement story, then choose the viewpoint that answers your engineering question.</text><g filter="url(#sh)"><rect x="70" y="165" width="1360" height="165" rx="28" fill="#fff"/><circle cx="155" cy="247" r="48" fill="#eef2ff"/><text x="155" y="261" text-anchor="middle" font-family="Arial" font-size="45">📦</text><text x="230" y="215" font-family="Arial" font-size="26" font-weight="700" fill="#172033">Smart Parcel Locker Pickup</text><text x="230" y="255" font-family="Arial" font-size="20" fill="#526078">Courier deposits → customer receives code → code validated → locker opens → pickup confirmed</text><rect x="1145" y="202" width="220" height="90" rx="20" fill="#f8fafc" stroke="#dbe4f0"/><text x="1255" y="237" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Same scenario</text><text x="1255" y="265" text-anchor="middle" font-family="Arial" font-size="15" fill="#526078">Different question → different view</text></g><path d="M750 330v52" stroke="#94a3b8" stroke-width="5"/><path d="M750 382l-12-18h24z" fill="#94a3b8"/><g filter="url(#sh)"><rect x="55" y="410" width="335" height="320" rx="26" fill="#fff"/><rect x="55" y="410" width="335" height="16" rx="8" fill="url(#uc)"/><circle cx="105" cy="475" r="27" fill="#f5f3ff"/><text x="105" y="484" text-anchor="middle" font-family="Arial" font-size="25">🎯</text><text x="145" y="470" font-family="Arial" font-size="23" font-weight="700" fill="#6d28d9">Use Case</text><text x="85" y="523" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Who uses the system, and why?</text><circle cx="130" cy="600" r="20" fill="none" stroke="#7c3aed" stroke-width="3"/><line x1="130" y1="620" x2="130" y2="665" stroke="#7c3aed" stroke-width="3"/><line x1="130" y1="635" x2="108" y2="652" stroke="#7c3aed" stroke-width="3"/><line x1="130" y1="635" x2="152" y2="652" stroke="#7c3aed" stroke-width="3"/><ellipse cx="255" cy="625" rx="72" ry="34" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="255" y="631" text-anchor="middle" font-family="Arial" font-size="13" fill="#4c1d95">Collect Parcel</text><line x1="150" y1="625" x2="183" y2="625" stroke="#7c3aed" stroke-width="3"/></g><g filter="url(#sh)"><rect x="410" y="410" width="335" height="320" rx="26" fill="#fff"/><rect x="410" y="410" width="335" height="16" rx="8" fill="url(#seq)"/><circle cx="460" cy="475" r="27" fill="#eff6ff"/><text x="460" y="484" text-anchor="middle" font-family="Arial" font-size="25">💬</text><text x="500" y="470" font-family="Arial" font-size="23" font-weight="700" fill="#1d4ed8">Sequence</text><text x="440" y="523" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Who interacts, and in what order?</text><line x1="470" y1="575" x2="470" y2="665" stroke="#2563eb" stroke-width="3"/><line x1="565" y1="575" x2="565" y2="665" stroke="#2563eb" stroke-width="3"/><line x1="660" y1="575" x2="660" y2="665" stroke="#2563eb" stroke-width="3"/><path d="M480 595h73" stroke="#2563eb" stroke-width="3"/><path d="M553 595l-10-7v14z" fill="#2563eb"/><path d="M575 625h73" stroke="#2563eb" stroke-width="3"/><path d="M648 625l-10-7v14z" fill="#2563eb"/></g><g filter="url(#sh)"><rect x="765" y="410" width="335" height="320" rx="26" fill="#fff"/><rect x="765" y="410" width="335" height="16" rx="8" fill="url(#state)"/><circle cx="815" cy="475" r="27" fill="#fff7ed"/><text x="815" y="484" text-anchor="middle" font-family="Arial" font-size="25">🔄</text><text x="855" y="470" font-family="Arial" font-size="23" font-weight="700" fill="#ea580c">State</text><text x="795" y="523" font-family="Arial" font-size="17" font-weight="700" fill="#172033">How does one subject change?</text><rect x="800" y="590" width="100" height="48" rx="18" fill="#fff7ed" stroke="#fb923c"/><rect x="955" y="590" width="100" height="48" rx="18" fill="#fff7ed" stroke="#fb923c"/><path d="M900 614h55" stroke="#f97316" stroke-width="3"/><path d="M955 614l-10-7v14z" fill="#f97316"/><text x="850" y="620" text-anchor="middle" font-family="Arial" font-size="13" fill="#7c2d12">Awaiting</text><text x="1005" y="620" text-anchor="middle" font-family="Arial" font-size="13" fill="#7c2d12">Collected</text></g><g filter="url(#sh)"><rect x="1120" y="410" width="325" height="320" rx="26" fill="#fff"/><rect x="1120" y="410" width="325" height="16" rx="8" fill="url(#act)"/><circle cx="1170" cy="475" r="27" fill="#ecfeff"/><text x="1170" y="484" text-anchor="middle" font-family="Arial" font-size="25">🧭</text><text x="1210" y="470" font-family="Arial" font-size="23" font-weight="700" fill="#0f766e">Activity</text><text x="1150" y="523" font-family="Arial" font-size="17" font-weight="700" fill="#172033">How does work flow and branch?</text><rect x="1160" y="585" width="92" height="42" rx="16" fill="#ecfeff" stroke="#14b8a6"/><polygon points="1290,584 1314,606 1290,628 1266,606" fill="#f0fdfa" stroke="#14b8a6"/><rect x="1340" y="585" width="78" height="42" rx="16" fill="#ecfeff" stroke="#14b8a6"/><path d="M1252 606h14M1314 606h26" stroke="#0f766e" stroke-width="3"/><text x="1206" y="611" text-anchor="middle" font-family="Arial" font-size="12" fill="#134e4a">Validate</text><text x="1379" y="611" text-anchor="middle" font-family="Arial" font-size="12" fill="#134e4a">Open</text></g><text x="750" y="782" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#475569">Actors & goals · Messages · Lifecycle · Workflow — four abstractions, one consistent system story</text></svg>